name: Package and publish prerelease

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        default: v0.1.0-beta.1

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  QT_VERSION: 6.10.3

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve and verify release metadata
        id: metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
            git fetch --tags --force
            git rev-parse --verify "refs/tags/${tag}"
            git checkout --detach "refs/tags/${tag}"
          fi
          cmake -DSOURCE_DIR="${GITHUB_WORKSPACE}" -DRELEASE_TAG="${tag}" \
            -P tools/verify_release_version.cmake
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

  windows:
    name: Windows x64 packages
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CXX: g++
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Install pinned NSIS
        shell: pwsh
        run: choco install nsis --version=3.11.0 --no-progress --yes

      - name: Configure, build, and test
        shell: pwsh
        run: |
          cmake -S . -B build/release -G Ninja `
            -D CMAKE_BUILD_TYPE=Release -D BUILD_TESTING=ON `
            -D NEWCONVERT9918_RELEASE_BUILD=ON
          cmake --build build/release --parallel 4
          ctest --test-dir build/release --output-on-failure

      - name: Stage and audit standalone runtime
        shell: pwsh
        run: |
          cmake --install build/release --prefix "${PWD}/stage"
          cmake -D ROOT="${PWD}/stage" `
            -D GUI_REL=bin/NewConvert9918.exe `
            -D CLI_REL=bin/newconvert9918-cli.exe `
            -D PLATFORM=windows -D REQUIRE_QT_LICENSES=ON `
            -P tools/audit_package.cmake
          cmake -D ROOT="${PWD}/stage" `
            -D GUI_REL=bin/NewConvert9918.exe `
            -D CLI_REL=bin/newconvert9918-cli.exe `
            -D SOURCE_IMAGE="${PWD}/tests/golden/source/tiny-rgba.png" `
            -D OUTPUT_DIR="${PWD}/smoke-output" `
            -D VERSION="${env:RELEASE_VERSION}" `
            -P tools/smoke_test_package.cmake

      - name: Create portable ZIP and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          cpack --config build/release/CPackConfig.cmake -G ZIP `
            -D "CPACK_PACKAGE_FILE_NAME=NewConvert9918-${env:RELEASE_VERSION}-Windows-x64-Portable" `
            -B dist
          cpack --config build/release/CPackConfig.cmake -G NSIS `
            -D "CPACK_PACKAGE_FILE_NAME=NewConvert9918-${env:RELEASE_VERSION}-Windows-x64-Setup" `
            -B dist
          if (-not (Test-Path "dist/NewConvert9918-${env:RELEASE_VERSION}-Windows-x64-Portable.zip")) { exit 1 }
          if (-not (Test-Path "dist/NewConvert9918-${env:RELEASE_VERSION}-Windows-x64-Setup.exe")) { exit 1 }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
          compression-level: 0
          if-no-files-found: error

  linux:
    name: Linux x64 packages
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CXX: g++
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
      QML_SOURCES_PATHS: ${{ github.workspace }}/app/qml
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Linux package prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 xvfb

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure, build, and test
        run: |
          cmake -S . -B build/release -G Ninja \
            -D CMAKE_BUILD_TYPE=Release -D BUILD_TESTING=ON \
            -D NEWCONVERT9918_RELEASE_BUILD=ON
          cmake --build build/release --parallel 4
          xvfb-run -a ctest --test-dir build/release --output-on-failure

      - name: Stage application tree
        run: |
          cmake --install build/release --prefix "${PWD}/AppDir/usr"

      - name: Download pinned AppImage tooling
        run: |
          curl --fail --location --retry 3 \
            --output linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 \
            --output linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Deploy Linux runtime and build AppImage
        run: |
          mkdir -p dist
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/NewConvert9918 \
            --desktop-file AppDir/usr/share/applications/io.github.ciscogarciafl.NewConvert9918.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/io.github.ciscogarciafl.NewConvert9918.png \
            --plugin qt \
            --output appimage
          generated_appimage="$(find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy*' -print -quit)"
          test -n "${generated_appimage}"
          mv "${generated_appimage}" \
            "dist/NewConvert9918-${RELEASE_VERSION}-Linux-x86_64.AppImage"

      - name: Audit and smoke-test deployed Linux tree
        run: |
          cmake -D ROOT="${PWD}/AppDir/usr" \
            -D GUI_REL=bin/NewConvert9918 \
            -D CLI_REL=bin/newconvert9918-cli \
            -D PLATFORM=linux -D REQUIRE_QT_LICENSES=ON \
            -P tools/audit_package.cmake
          xvfb-run -a cmake -D ROOT="${PWD}/AppDir/usr" \
            -D GUI_REL=bin/NewConvert9918 \
            -D CLI_REL=bin/newconvert9918-cli \
            -D SOURCE_IMAGE="${PWD}/tests/golden/source/tiny-rgba.png" \
            -D OUTPUT_DIR="${PWD}/smoke-output" \
            -D VERSION="${RELEASE_VERSION}" \
            -P tools/smoke_test_package.cmake
          xvfb-run -a "dist/NewConvert9918-${RELEASE_VERSION}-Linux-x86_64.AppImage" --smoke-test
          ldd AppDir/usr/bin/NewConvert9918 | tee gui-dependencies.txt
          ! grep -q "not found" gui-dependencies.txt

      - name: Build and install-test Debian package
        run: |
          cp -a AppDir DebRoot
          rm -f DebRoot/AppRun DebRoot/.DirIcon DebRoot/*.desktop DebRoot/*.png
          # linuxdeploy preserves distribution copyright files for bundled
          # libraries. They are useful in the AppImage, but a .deb must not
          # claim paths owned by the host distribution's dependency packages.
          rm -rf -- DebRoot/usr/share/doc
          mkdir -p DebRoot/DEBIAN
          if [[ "${RELEASE_VERSION}" == *-* ]]; then
            version_core="${RELEASE_VERSION%%-*}"
            version_suffix="${RELEASE_VERSION#*-}"
            deb_version="${version_core}~${version_suffix}"
          else
            deb_version="${RELEASE_VERSION}"
          fi
          sed -e "s|@VERSION@|${deb_version}|g" \
            packaging/linux/control.in > DebRoot/DEBIAN/control
          dpkg-deb --root-owner-group --build DebRoot \
            "dist/newconvert9918_${RELEASE_VERSION}_amd64.deb"
          sudo apt-get install --yes \
            "./dist/newconvert9918_${RELEASE_VERSION}_amd64.deb"
          newconvert9918-cli --version | grep "${RELEASE_VERSION}"
          sudo apt-get remove --yes newconvert9918

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
          compression-level: 0
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} package
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    env:
      CXX: clang++
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure, build, and test
        run: |
          cmake -S . -B build/release -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -D BUILD_TESTING=ON \
            -D NEWCONVERT9918_RELEASE_BUILD=ON
          cmake --build build/release --parallel 4
          ctest --test-dir build/release --output-on-failure

      - name: Stage, ad-hoc sign, audit, and smoke test
        run: |
          cmake --install build/release --prefix "${PWD}/stage"
          codesign --force --deep --sign - stage/NewConvert9918.app
          cmake -D ROOT="${PWD}/stage" \
            -D GUI_REL=NewConvert9918.app/Contents/MacOS/NewConvert9918 \
            -D CLI_REL=bin/newconvert9918-cli \
            -D PLATFORM=macos -D REQUIRE_QT_LICENSES=ON \
            -P tools/audit_package.cmake
          cmake -D ROOT="${PWD}/stage" \
            -D GUI_REL=NewConvert9918.app/Contents/MacOS/NewConvert9918 \
            -D CLI_REL=bin/newconvert9918-cli \
            -D SOURCE_IMAGE="${PWD}/tests/golden/source/tiny-rgba.png" \
            -D OUTPUT_DIR="${PWD}/smoke-output" \
            -D VERSION="${RELEASE_VERSION}" \
            -P tools/smoke_test_package.cmake
          codesign --verify --deep --strict stage/NewConvert9918.app
          otool -L stage/NewConvert9918.app/Contents/MacOS/NewConvert9918 | tee gui-dependencies.txt
          ! grep -q "${PWD}" gui-dependencies.txt

      - name: Create DMG
        run: |
          mkdir -p dist
          dmg="dist/NewConvert9918-${RELEASE_VERSION}-macOS-${{ matrix.arch }}.dmg"
          dmg_root="${RUNNER_TEMP}/newconvert9918-dmg-${{ matrix.arch }}"
          rm -rf -- "${dmg_root}"
          mkdir -p "${dmg_root}"
          cp -a stage/. "${dmg_root}/"
          ln -s /Applications "${dmg_root}/Applications"
          for attempt in 1 2 3; do
            rm -f -- "${dmg}"
            hdiutil create -ov -srcfolder "${dmg_root}" \
              -volname "New Convert 9918" -format UDZO "${dmg}" &
            dmg_pid=$!
            (
              sleep 600
              if kill -0 "${dmg_pid}" 2>/dev/null; then
                echo "DMG creation timed out; stopping hdiutil."
                kill -TERM "${dmg_pid}" 2>/dev/null || true
              fi
            ) &
            watchdog_pid=$!
            if wait "${dmg_pid}"; then
              dmg_status=0
            else
              dmg_status=$?
            fi
            kill "${watchdog_pid}" 2>/dev/null || true
            wait "${watchdog_pid}" 2>/dev/null || true
            if [[ "${dmg_status}" -eq 0 ]]; then
              break
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              exit 1
            fi
            echo "hdiutil failed or was temporarily busy; retrying DMG creation (${attempt}/3)."
            sleep $((attempt * 15))
          done
          test -f "${dmg}"
          hdiutil verify "${dmg}"

      - name: Upload macOS release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/*.dmg
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease
    needs: [validate, windows, linux, macos]
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Download all release assets
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify asset set and generate checksums
        shell: bash
        run: |
          expected=(
            "NewConvert9918-${RELEASE_VERSION}-Windows-x64-Setup.exe"
            "NewConvert9918-${RELEASE_VERSION}-Windows-x64-Portable.zip"
            "NewConvert9918-${RELEASE_VERSION}-Linux-x86_64.AppImage"
            "newconvert9918_${RELEASE_VERSION}_amd64.deb"
            "NewConvert9918-${RELEASE_VERSION}-macOS-x86_64.dmg"
            "NewConvert9918-${RELEASE_VERSION}-macOS-arm64.dmg"
          )
          for asset in "${expected[@]}"; do
            test -s "release-assets/${asset}"
          done
          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS.txt \
            -printf '%f\n' | sort > actual-assets.txt
          printf '%s\n' "${expected[@]}" | sort > expected-assets.txt
          diff -u expected-assets.txt actual-assets.txt
          (cd release-assets && sha256sum "${expected[@]}" > SHA256SUMS.txt)
          (cd release-assets && sha256sum --check SHA256SUMS.txt)

      - name: Create immutable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to replace published assets." >&2
            exit 1
          fi
          gh release create "${TAG}" release-assets/* \
            --verify-tag \
            --prerelease \
            --title "New Convert 9918 ${TAG}" \
            --notes-file "docs/releases/${TAG}.md"

      - name: Preserve final asset set
        uses: actions/upload-artifact@v4
        with:
          name: published-${{ needs.validate.outputs.tag }}
          path: release-assets/*
          compression-level: 0
          if-no-files-found: error
